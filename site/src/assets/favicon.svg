<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The step wedge: a calibrated density strip, which is what a tiered
       confidence ladder is. Bars carry the same opacities the tiers render at. -->
  <rect width="32" height="32" fill="#14161c"/>
  <g fill="#e8743b">
    <rect x="4"  y="6" width="5" height="20" opacity="1"/>
    <rect x="10" y="6" width="5" height="20" opacity=".72"/>
    <rect x="16" y="6" width="5" height="20" opacity=".44"/>
    <rect x="22" y="6" width="5" height="20" opacity=".18"/>
  </g>
</svg>
