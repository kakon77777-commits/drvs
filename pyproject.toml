[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drvs"
version = "0.1.0"
description = "Dynamic Revealing Vector Search — build-time chunking/embedding pipeline for a corpus-agnostic client-side search engine."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Neo.K / EveMissLab" }]
requires-python = ">=3.9"

[project.optional-dependencies]
embed = ["sentence-transformers>=2.2"]

[tool.setuptools]
packages = ["build"]
